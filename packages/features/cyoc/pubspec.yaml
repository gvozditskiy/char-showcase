name: cyoc
description: Char cyoc module
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0-0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.2.1
  core:
    path: ../../core
  navigation:
    path: ../../navigation
  common_ui:
    path: ../../common_ui
  character_data:
    path: ../../character_data
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  go_router: ^16.3.0
  intl: any

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/options/
    - assets/data/
