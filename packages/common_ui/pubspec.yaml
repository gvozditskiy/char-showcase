name: common_ui
description: Char common_ui module
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0-0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.17.2
  core:
    path: ../core
  equatable: ^2.0.5
  flutter_animate: ^4.3.0
  flutter_bloc: ^9.0.0
  flutter_styled_toast: ^2.2.1
  go_router: ^16.3.0
  intl: any
  navigation:
    path: ../navigation

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/images/ic_loader_small.webp
    - lib/assets/images/ic_loader_large.webp
